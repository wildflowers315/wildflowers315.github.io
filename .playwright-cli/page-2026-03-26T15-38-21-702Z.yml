        - paragraph [ref=e64]:
          - text: Marc Rußwurm is a Junior Research Group Leader of the
          - link "MEO-lab" [ref=e65] [cursor=pointer]:
            - /url: https://meo-lab.github.io/
          - text: at the University of Bonn. He was previously Assistant Professor of Machine Learning and Remote Sensing at Wageningen University. His background is in Geodesy and Geoinformation, and he obtained a Ph.D. in Remote Sensing Technology at TU Munich. During his Ph.D., he visited the European Space Agency and the University of Oxford as a participant in the Frontier Development Lab (2018), and conducted research stays at the Obelix Laboratory in Vannes and the Lobell Lab at Stanford. As a postdoctoral researcher, he joined the Environmental Computational Science and Earth Observation Laboratory at EPFL, Switzerland. His research focuses on modern machine learning for Earth observation, with an emphasis on geospatial representation learning and Earth Embeddings. He develops methods that enable robust, transferable analysis of geospatial data and applies them to challenges such as agriculture, species mapping, and marine litter monitoring, with a particular interest in domain shifts and transfer learning in geographic settings.
